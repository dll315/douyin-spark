<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抖音自动续火花</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e7eaf0;--muted:#8a93a6;--accent:#fe2c55;--ok:#2ecc71;--err:#ff5f5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
.wrap{max-width:1020px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:20px;margin:0 0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 330px;gap:16px}
@media(max-width:880px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea{background:#0d0f13;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:64px}
label{display:block;color:var(--muted);margin:10px 0 4px;font-size:12px}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font:inherit;background:#232836;color:var(--text)}
button.primary{background:var(--accent);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{color:var(--muted);font-weight:500;font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;white-space:nowrap}
.badge.ok{background:rgba(46,204,113,.15);color:var(--ok)}
.badge.err{background:rgba(255,95,95,.15);color:var(--err)}
.badge.off{background:#232836;color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot-on{background:var(--ok)}.dot-off{background:var(--err)}
.muted{color:var(--muted)}
.logs{max-height:300px;overflow:auto;font-size:12px}
.log-line{padding:4px 0;border-bottom:1px dashed #20242e;word-break:break-all}
.log-error{color:var(--err)}.log-warn{color:#f5b942}.log-info{color:var(--text)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#232836;border:1px solid var(--line);padding:10px 18px;border-radius:10px;display:none;z-index:99}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:90}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;max-width:320px}
.modal img{width:220px;height:220px;background:#fff;border-radius:8px;object-fit:contain}
</style>
</head>
<body>
<div class="wrap">
<h1><span style="color:var(--accent)">🔥</span> 抖音自动续火花控制台 <span id="runBadge" class="badge off" style="display:none">任务运行中…</span></h1>
<div class="grid">
<div>
 <div class="card">
  <h2>联系人（昵称需与网页版私信列表一致）</h2>
  <div class="row">
    <input id="newName" placeholder="对方昵称" style="flex:1;min-width:180px">
    <input id="newMsgs" placeholder="自定义话术，用 | 分隔（留空则用默认）" style="flex:2;min-width:220px">
    <button class="primary" onclick="addContact()">添加</button>
  </div>
  <table><thead><tr><th>昵称 / 话术</th><th>启用</th><th>上次结果</th><th></th></tr></thead><tbody id="contactRows"></tbody></table>
 </div>
 <div class="card"><h2>运行日志</h2><div id="logs" class="logs"><span class="muted">暂无日志</span></div></div>
</div>
<div>
 <div class="card">
  <h2>账号状态</h2>
  <div id="loginStatus"><span class="status-dot dot-off"></span>检测中…</div>
  <div class="row" style="margin-top:12px">
    <button class="primary" onclick="startLogin()">扫码登录</button>
    <button class="ghost" onclick="doLogout()">退出登录</button>
  </div>
 </div>
 <div class="card">
  <h2>发送计划</h2>
  <div id="nextRun" class="muted">--</div>
  <label>每天发送时间</label><input type="time" id="setTime">
  <label>随机延迟上限（分钟，防风控）</label><input type="number" id="setJitter" min="0" max="180">
  <label>默认话术（每行一条，随机选用）</label><textarea id="setDefaultMsgs"></textarea>
  <label style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="setHeadless"> 无头模式（服务器部署请勾选；二维码扫不出时可取消勾选调试）</label>
  <div class="row" style="margin-top:12px">
    <button class="primary" onclick="saveSettings()">保存设置</button>
    <button onclick="runNow()">立即执行一轮</button>
  </div>
 </div>
</div>
</div>
</div>

<div class="modal-mask" id="qrMask"><div class="modal">
  <h2 style="margin:0 0 12px">使用抖音 App 扫码登录</h2>
  <img id="qrImg" alt="二维码加载中">
  <p class="muted" style="font-size:12px">每 3 秒自动检测登录状态<br>若长时间空白，请关闭无头模式后重试</p>
  <button class="ghost" onclick="closeQr()">关闭</button>
</div></div>
<div id="toast"></div>

<script>
let filling=false;
const $=id=>document.getElementById(id);
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2600);}
async function api(url,opt){const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));if(!r.ok){let m='请求失败 '+r.status;try{const j=await r.json();m=j.detail||m}catch(e){}throw new Error(m);}return r.json();}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

async function refresh(){
 let d;try{d=await api('/api/overview')}catch(e){return}
 $('loginStatus').innerHTML=d.logged_in?'<span class="status-dot dot-on"></span>已登录':'<span class="status-dot dot-off"></span>未登录';
 $('nextRun').textContent=d.next_run?('下次执行：'+d.next_run):'暂无计划';
 $('runBadge').style.display=d.running?'inline-block':'none';
 renderContacts(d.contacts);
 renderLogs(d.logs);
 const maskOn=$('qrMask').style.display==='flex';
 if(d.login_phase==='waiting'&&maskOn&&d.qr_image)$('qrImg').src='data:image/png;base64,'+d.qr_image;
 if(maskOn&&d.login_phase==='ok'){closeQr(false);toast('登录成功');}
 if(maskOn&&d.login_phase==='failed'){closeQr(false);toast('登录失败或超时，请重试');}
 if(!filling){
  const s=d.settings;
  $('setTime').value=String(s.hour).padStart(2,'0')+':'+String(s.minute).padStart(2,'0');
  $('setJitter').value=s.jitter_minutes;
  $('setDefaultMsgs').value=(s.default_messages||[]).join('\n');
  $('setHeadless').checked=!!s.headless;
 }
}

function renderContacts(cs){
 const tb=$('contactRows');tb.innerHTML='';
 if(!cs.length){tb.innerHTML='<tr><td colspan="4" class="muted">还没有联系人，先添加一个吧</td></tr>';return;}
 cs.forEach(c=>{
  const tr=document.createElement('tr');
  let badge='<span class="badge off">从未发送</span>';
  if(c.last)badge=c.last.ok
    ?'<span class="badge ok">'+esc(c.last.time)+' 已发送</span>'
    :'<span class="badge err" title="'+esc(c.last.detail)+'">'+esc(c.last.time)+' 失败</span>';
  tr.innerHTML=
   '<td>'+esc(c.name)+'<div class="muted" style="font-size:12px">'+((c.messages&&c.messages.length)?c.messages.length+' 条自定义话术':'使用默认话术')+'</div></td>'
   +'<td><input type="checkbox" '+(c.enabled?'checked':'')+' onchange="toggleContact(\''+c.id+'\',this.checked)"></td>'
   +'<td>'+badge+'</td>'
   +'<td><button class="ghost" onclick="delContact(\''+c.id+'\')">删除</button></td>';
  tb.appendChild(tr);
 });
}

function renderLogs(logs){
 const box=$('logs');
 if(!logs||!logs.length){box.innerHTML='<span class="muted">暂无日志</span>';return;}
 box.innerHTML='';
 logs.forEach(l=>{const div=document.createElement('div');div.className='log-line log-'+l.level;div.textContent='['+l.time+'] '+l.text;box.appendChild(div);});
}

async function addContact(){
 const name=$('newName').value.trim();
 const msgs=$('newMsgs').value.split('|').map(s=>s.trim()).filter(Boolean);
 if(!name)return toast('请填写对方昵称');
 try{await api('/api/contacts',{method:'POST',body:JSON.stringify({name,messages:msgs})});$('newName').value='';$('newMsgs').value='';toast('已添加');refresh();}catch(e){toast(e.message);}
}
async function toggleContact(id,on){try{await api('/api/contacts/'+id,{method:'PUT',body:JSON.stringify({enabled:on})});refresh();}catch(e){toast(e.message);}}
async function delContact(id){if(!confirm('确认删除该联系人？'))return;try{await api('/api/contacts/'+id,{method:'DELETE'});refresh();}catch(e){toast(e.message);}}
async function startLogin(){
 try{
  await api('/api/login/start',{method:'POST'});
  $('qrMask').style.display='flex';
  refresh();
 }catch(e){toast(e.message);}
}
function closeQr(reset=true){$('qrMask').style.display='none';if(reset)api('/api/login/reset',{method:'POST'}).catch(()=>{});}
async function doLogout(){if(!confirm('确认退出登录并清除本地凭证？'))return;try{await api('/api/logout',{method:'POST'});}catch(e){toast(e.message);}refresh();}
async function saveSettings(){
 filling=false;
 const t=($('setTime').value||'09:00').split(':');
 const body={hour:+t[0]||0,minute:+t[1]||0,jitter_minutes:+$('setJitter').value||0,headless:$('setHeadless').checked,default_messages:$('setDefaultMsgs').value.split('\n').map(s=>s.trim()).filter(Boolean)};
 try{await api('/api/settings',{method:'PUT',body:JSON.stringify(body)});toast('已保存，计划已更新');}catch(e){toast(e.message);}
 refresh();
}
async function runNow(){try{await api('/api/run',{method:'POST'});toast('任务已开始，请在下方日志查看进度');}catch(e){toast(e.message);}}

['setTime','setJitter','setDefaultMsgs','setHeadless'].forEach(id=>$(id).addEventListener('focus',()=>filling=true));
refresh();
setInterval(refresh,5000);
</script>
</body>
</html>
